name: 'Release ArkBar'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ArkBar v__VERSION__'
          releaseBody: |
            ## 🚀 ArkBar v__VERSION__ 发布说明

            ### ⚠️ macOS 首次打开提示“应用已损坏，无法打开”解决办法
            由于本开源项目未购买苹果昂贵的商业开发者证书（$99/年），从浏览器下载后 macOS Gatekeeper 会自动对应用添加隔离标记。
            **解决方法**：打开「终端」(Terminal.app)，复制并粘贴执行以下命令后回车即可正常打开：
            ```bash
            xattr -dr com.apple.quarantine /Applications/ArkBar.app
            ```

            ---

            ### 🌟 v0.1.3 重磅更新：全平台「应用内一键在线极速更新」
            1. **🔥 应用内直接更新，无需手动前往网页下载**：
               - **全平台支持（macOS 与 Windows 双端）**：发现新版本时，在主面板顶部通知栏或偏好设置中点击「立即在线更新」，即可在软件内全自动完成下载、解压、覆盖与平滑重启。
               - **可视化更新进度弹窗**：实时展示下载进度条、下载速度与字节数（如 `4.5 MB / 8.5 MB`）、四阶段状态指示（连接 ➔ 下载包 ➔ 解压安装 ➔ 重启生效）。
               - **macOS 免隔离属性**：通过应用内在线更新的应用，在解压覆盖阶段自动移除 `com.apple.quarantine` 隔离属性，**彻底告别更新后的“已损坏”弹窗**！
               - **Windows 静默升级**：自动静默拉起更新程序并在后台无感替换完成升级，并保持黑框终端彻底不弹出。
               - **双重兜底**：如遇极端网络波动，依然保留「网页下载」通道，确保无论何种环境均可顺畅获取最新版本。

            ---

            ### 🌟 历史核心特性回顾
            - **Windows 全面优化**：后台诊断执行全静默（无黑框弹窗），环境变量高速缓存，流畅无卡顿。
            - **SSO 鉴权双模机制**：除常规浏览器跳转外，支持火山官方内置授权码直连登录，彻底解决本地回环端口限制导致的 `redirect_uri` 报错。
            - **套餐精准动态识别**：支持精准匹配并展示 Pro 套餐 (🚀)、Team 套餐 (👥)、Lite 套餐 (💎) 与 企业套餐 (🏢)。
            - **启动自动呼出**：双端启动时自动弹出主卡片窗口并吸附托盘，开箱即用。
            - **桌面微型悬浮窗**：随时在桌面自由拖拽查看近 5 小时用量状态。

            ---

            ### 📦 安装包下载指引
            - **macOS (Apple Silicon M1/M2/M3/M4 系列)**: `ArkBar_*_aarch64.dmg`
            - **macOS (Intel 处理器)**: `ArkBar_*_x64.dmg`
            - **Windows (64位安装包)**: `ArkBar_*_x64-setup.exe` (或 `.msi`)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

[package]
name = "ark-bar"
version = "0.5.0"
description = "火山方舟 Coding Plan 菜单栏配额监控小工具"
authors = ["chzisnull"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ark_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# macOS-only: NSProcessInfo activity to opt out of App Nap (kept in lockstep
# with the objc2-foundation version already in Tauri's dependency tree)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
# 拖动跟随要靠 NSEvent.pressedMouseButtons 判断左键是否还按着（Codenotch 同款做法）
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSScreen"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
